<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var t = localStorage.getItem('di-theme');
        if (t === 'light') {
          document.documentElement.style.setProperty('--color-bg', '#faf8f4');
          document.documentElement.style.setProperty('--color-text', '#1a1815');
          document.documentElement.style.setProperty('--color-scrollbar-thumb', '#cfc8b6');
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
